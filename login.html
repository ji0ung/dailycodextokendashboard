<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>로그인 | Codex Daybook</title><style>:root{--ink:#182832;--muted:#6b7b84;--line:#d6e0e4;--blue:#176b9a}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f3f7f8;color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif}main{width:min(400px,calc(100% - 32px));background:#fff;border:1px solid var(--line);border-radius:6px;padding:26px}h1{font-size:25px;margin:0 0 5px}p{color:var(--muted);margin:0 0 20px}label{display:block;font-size:12px;font-weight:800;margin:12px 0 5px}input{width:100%;padding:11px;border:1px solid var(--line);border-radius:4px;font:inherit}button{width:100%;margin-top:18px;padding:11px;border:0;border-radius:4px;background:var(--blue);color:#fff;font-weight:800;cursor:pointer}.error{color:#a13d2d;min-height:22px;margin:10px 0 0;font-size:13px}</style></head><body><main><h1>Codex Daybook</h1><p id="intro">로컬 작업 기록에 로그인하세요.</p><form id="form"><label>이메일</label><input id="email" type="email" autocomplete="username" required><label>비밀번호</label><input id="password" type="password" autocomplete="current-password" minlength="12" required><button id="submit">로그인</button><p class="error" id="error"></p></form></main><script>const form=document.querySelector('#form'),intro=document.querySelector('#intro'),button=document.querySelector('#submit'),error=document.querySelector('#error');let setup=false;fetch('/api/auth/status').then(r=>r.json()).then(s=>{if(s.authenticated)location.href='/';setup=s.needsSetup;if(setup){intro.textContent='처음 한 번 사용할 관리자 계정을 만드세요.';button.textContent='관리자 만들기';document.querySelector('#password').autocomplete='new-password'}});form.onsubmit=async e=>{e.preventDefault();error.textContent='';button.disabled=true;const response=await fetch(setup?'/api/auth/setup':'/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value,password:password.value})});const body=await response.json();button.disabled=false;if(response.ok)location.href='/';else error.textContent=body.error||'로그인하지 못했습니다.'};</script></body></html>
